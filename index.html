<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unisfera Labs</title>
<meta name="description" content="Apps hechas con cuidado para las familias.">
<style>
  :root{--bg:#f6f3ee;--card:#fff;--text:#1d1b22;--text-2:#56525e;--line:#e4dfd6;--accent:#5f74c4}
  @media (prefers-color-scheme: dark){:root{--bg:#14121a;--card:#1d1b25;--text:#ece9f2;--text-2:#a8a3b3;--line:#2c2936;--accent:#9fb0f0}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  main{max-width:720px;margin:0 auto;padding:48px 16px 64px}
  h1{font-size:32px;margin:0 0 4px}
  p{color:var(--text-2)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px 20px;margin:20px 0}
  .card h2{margin:0 0 4px;font-size:21px}
  a{color:var(--accent)}
</style>
</head>
<body>
<main>
  <h1>Unisfera Labs</h1>
  <p>Apps hechas con cuidado para las familias.</p>
  <div class="card">
    <h2>Cerca</h2>
    <p>Ve dónde está tu familia, recibe avisos al llegar y salir, y cuídense juntos. Sin anuncios y sin vender tus datos.</p>
    <p><a href="cerca/privacidad.html">Política de privacidad de Cerca</a></p>
  </div>
  <p>Contacto: <a href="mailto:unisferalabs@gmail.com">unisferalabs@gmail.com</a></p>
</main>
</body>
</html>
